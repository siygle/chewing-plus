name: macOS
# Separate from check.yml so a missing macOS runner cannot turn the Linux
# build red. continue-on-error keeps a cancelled or failed runner non-blocking.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - plus
jobs:
  typecheck:
    name: typecheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # macos-14-arm64 is not a supported runner image here.
        os: [macos-15, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Protocol tests and IMK typecheck
        run: sh macos/typecheck.sh
  bundle:
    name: bundle app (macos-latest)
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Build ChewingPlus.app
        run: bash macos/build-app.sh
      - name: Build unsigned package
        run: bash macos/build-pkg.sh
      - name: Check IMK bundle and package
        run: >-
          python3 macos/check-bundle.py
          --source .
          --app macos/build/ChewingPlus.app
          --pkg macos/build/ChewingPlus.pkg
          --component-plist macos/build/component.plist
      - name: Install the package and check Text Input Sources
        run: |
          # The build copy has the same bundle id; drop it so TIS only sees
          # the installed app.
          lsregister=/System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister
          "$lsregister" -u "$PWD/macos/build/ChewingPlus.app" || true
          rm -rf macos/build/ChewingPlus.app
          sudo installer -pkg macos/build/ChewingPlus.pkg -target /
          "/Library/Input Methods/ChewingPlus.app/Contents/MacOS/ChewingPlus" --register
          xcrun swift macos/check-tis.swift im.chewing.inputmethod.ChewingPlus.Bopomofo
      - name: Translation smoke test (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          # The installed daemon finds the installed plugin without
          # VOXKIT_MT_PLUGIN. Downloads the HY-MT model (~1.1 GB).
          support="$HOME/Library/Application Support/ChewingPlus"
          ls -l "$support" || true
          if [ -f "$support/libvoxkit-mt.dylib" ]; then
              echo "using the installed daemon and plugin"
              vk="$support/voxkit"
          else
              echo "::warning::postinstall did not copy the plugin for this user; using the build tree"
              vk=macos/build/fcitx5-voxkit/daemon/target/release/voxkit
              export VOXKIT_MT_PLUGIN="$PWD/macos/build/voxkit-mt/libvoxkit-mt.dylib"
          fi
          export VOXKIT_MODELS_DIR="$RUNNER_TEMP/voxkit-models"
          "$vk" translate --wait --target en \
              "今天天氣很好，我們去公園散步" | tee "$RUNNER_TEMP/translate.txt"
          test -s "$RUNNER_TEMP/translate.txt"
          grep -qi 'weather\|park' "$RUNNER_TEMP/translate.txt"
      - name: Upload the package (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ChewingPlus-pkg
          path: macos/build/ChewingPlus.pkg
          retention-days: 7
          if-no-files-found: error
