name: CI
on:
  push:
    branches:
      - master
      - plus
  pull_request:
    branches:
      - master
      - plus
jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v7
      - uses: fcitx/github-actions@clang-format
  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          # Every branch builds the pinned libchewing 0.14 tag
          # (Rust edition 2024, git-lfs), not the distro 0.13.
          pacman -Syu --noconfirm base-devel clang cmake ninja extra-cmake-modules \
            fmt libuv boost git rust git-lfs ibus libadwaita
      - uses: actions/checkout@v7
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v6
        with:
          path: 'fcitx5/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DENABLE_EMOJI=Off -DUSE_SYSTEMD=Off
      - uses: actions/checkout@v7
        with:
          path: fcitx5-chewing
          submodules: true
      - name: Init CodeQL
        if: matrix.compiler == 'gcc'
        uses: github/codeql-action/init@v4
        with:
          languages: cpp
          source-root: fcitx5-chewing
      - name: Check IMK Info.plist
        run: python3 fcitx5-chewing/macos/check-bundle.py --source fcitx5-chewing
      - name: Build pinned libchewing 0.14.0-rc.1
        run: |
          bash fcitx5-chewing/scripts/bundle-libchewing.sh --shared /usr
          pkg-config --modversion chewing
          test -f /usr/share/libchewing/static_dict.bin
      - name: Build and Install fcitx5-chewing
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-chewing
          cmake-option: >-
            -DENABLE_IBUS=ON -DENABLE_IBUS_SETUP=ON
        env:
          CHEWING_TEST_DATA: /usr/share/libchewing
      - name: Test
        run: |
          ctest --test-dir fcitx5-chewing/build --output-on-failure
        env:
          CHEWING_TEST_DATA: /usr/share/libchewing
      - name: CodeQL Analysis
        if: matrix.compiler == 'gcc'
        uses: github/codeql-action/analyze@v4
        with:
          checkout_path: ${{ github.workspace }}/fcitx5-chewing

