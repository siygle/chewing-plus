name: CI
on:
  push:
    branches:
      - master
      - plus
  pull_request:
    branches:
      - master
      - plus
jobs:
  clang-format:
    name: Check clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm git clang diffutils
          git config --global --add safe.directory $GITHUB_WORKSPACE
      - uses: actions/checkout@v4
      - uses: fcitx/github-actions@clang-format
  check:
    name: Build and test
    needs: clang-format
    runs-on: ubuntu-latest
    container: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cxx_compiler: g++
          - compiler: clang
            cxx_compiler: clang++
    env:
      CC: ${{ matrix.compiler }}
      CXX: ${{ matrix.cxx_compiler }}
    steps:
      - name: Install dependencies
        run: |
          # master keeps the distro libchewing. plus and every branch stacked
          # on it build the pinned 0.14 tag (Rust edition 2024, git-lfs).
          pkgs="base-devel clang cmake ninja extra-cmake-modules fmt libuv boost git"
          if [ "$GITHUB_REF" = "refs/heads/master" ] || [ "$GITHUB_BASE_REF" = "master" ]; then
            pkgs="$pkgs libchewing"
          else
            pkgs="$pkgs rust git-lfs ibus"
          fi
          pacman -Syu --noconfirm $pkgs
      - uses: actions/checkout@v4
        with:
          repository: fcitx/fcitx5
          path: fcitx5
      - name: Cache fcitx5 data files
        uses: actions/cache@v4
        with:
          path: 'fcitx5/**/*.tar.*'
          key: ${{ runner.os }}-${{ hashFiles('fcitx5/src/modules/spell/CMakeLists.txt')
            }}
      - name: Build and Install fcitx5
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5
          cmake-option: >-
            -DENABLE_KEYBOARD=Off -DENABLE_X11=Off -DENABLE_WAYLAND=Off -DENABLE_ENCHANT=Off
            -DENABLE_DBUS=Off -DENABLE_SERVER=Off -DENABLE_EMOJI=Off -DUSE_SYSTEMD=Off
      - uses: actions/checkout@v4
        with:
          path: fcitx5-chewing
          submodules: true
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          source-root: fcitx5-chewing
      - name: Build pinned libchewing 0.14.0-rc.1
        if: github.ref != 'refs/heads/master' && github.base_ref != 'master'
        run: |
          bash fcitx5-chewing/scripts/bundle-libchewing.sh --shared /usr
          pkg-config --modversion chewing
          test -f /usr/share/libchewing/static_dict.bin
      - name: Build and Install fcitx5-chewing
        uses: fcitx/github-actions@cmake
        with:
          path: fcitx5-chewing
          cmake-option: >-
            ${{ (github.ref != 'refs/heads/master' && github.base_ref != 'master') && '-DENABLE_IBUS=ON' || '' }}
        env:
          CHEWING_TEST_DATA: /usr/share/libchewing
      - name: Test
        run: |
          ctest --test-dir fcitx5-chewing/build --output-on-failure
        env:
          CHEWING_TEST_DATA: /usr/share/libchewing
      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v2

